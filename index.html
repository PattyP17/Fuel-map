<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12161c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>J.B. Hunt Fuel Stops</title>
<style>
  :root{
    --bg:#12161c; --panel:#1a2029; --panel2:#222a35; --line:#2e3846;
    --ink:#e9edf2; --dim:#93a0b1; --amber:#f2b23c;
    --pilot:#e2483a; --flyingj:#3f7fd6; --loves:#f2c744; --ta:#57b96a; --jbh:#e07a2a;
    --sb: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{display:flex;flex-direction:column;height:100dvh}

  header{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
    padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .titlebar{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  h1{font-size:16px;font-weight:650;margin:0}
  .count{font-size:12px;color:var(--dim)}
  .row{display:flex;gap:8px}
  input[type=search]{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:10px;padding:11px 12px;font-size:16px}
  input[type=search]::placeholder{color:#6f7d8e}
  select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 8px;font-size:14px;max-width:34%}
  .tabs{display:flex;gap:6px;margin-top:8px}
  .tab{flex:1;padding:10px;text-align:center;border-radius:10px;font-weight:600;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .tab.on{background:var(--amber);color:#1a1206;border-color:var(--amber)}

  main{flex:1 1 auto;position:relative;min-height:0}
  .hidden{display:none !important}

  /* ---- map ---- */
  #map{position:absolute;inset:0;overflow:hidden;background:#0d1116;touch-action:none;cursor:grab}
  #map.drag{cursor:grabbing}
  #tiles{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #tiles img{position:absolute;width:256px;height:256px;display:block;
    image-rendering:auto;pointer-events:none;-webkit-user-drag:none}
  #pins{position:absolute;inset:0;pointer-events:none}
  .pin{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
    border:2px solid #0d1116;pointer-events:auto;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.6)}
  .pin.sel{width:24px;height:24px;margin:-12px 0 0 -12px;border-color:#fff;z-index:5}
  .me{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
    background:var(--amber);border:3px solid #12161c;z-index:6}
  .mering{position:absolute;border-radius:50%;background:rgba(242,178,60,.14);
    border:1px solid rgba(242,178,60,.5);z-index:4}

  .mapbtns{position:absolute;right:12px;bottom:calc(14px + var(--sb));z-index:20;
    display:flex;flex-direction:column;gap:8px}
  .mbtn{width:50px;height:50px;border-radius:25px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:20px;font-weight:600;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .mbtn.on{background:var(--amber);color:#1a1206;border-color:var(--amber)}
  #attrib{position:absolute;left:6px;bottom:calc(4px + var(--sb));z-index:10;
    font-size:10px;color:#6f7d8e;background:rgba(18,22,28,.7);padding:2px 6px;border-radius:4px}
  #tiles.light img{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.8)}
  #map.pick{cursor:crosshair}
  #map.pick::after{content:"Tap where you are";position:absolute;left:50%;top:14px;
    transform:translateX(-50%);background:var(--amber);color:#1a1206;font-weight:650;
    font-size:13px;padding:7px 14px;border-radius:16px;z-index:18;pointer-events:none}
  .me.manual{background:#7fb2f0}
  #hint{position:absolute;left:12px;right:12px;top:12px;z-index:25;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:13px 14px;
    box-shadow:0 6px 20px rgba(0,0,0,.55)}
  #hint b{font-size:14px}
  #hint p{margin:6px 0 10px;font-size:13px;color:var(--dim);line-height:1.45}
  #hint .btn{width:100%;flex:none;margin-top:6px}
  #tilewarn{position:absolute;top:12px;left:12px;right:12px;z-index:15;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--dim)}

  /* ---- cards ---- */
  #list{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:8px 10px calc(20px + var(--sb))}
  .stop{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);
    border-radius:12px;padding:11px 12px;margin-bottom:8px}
  .stop h2{font-size:15px;font-weight:650;margin:0 0 2px}
  .meta{font-size:13px;color:var(--dim)}
  .addr{font-size:14px;margin:5px 0 2px}
  .hwy{font-size:13px;color:var(--amber);font-weight:600}
  .dist{float:right;font-size:13px;color:var(--dim);font-weight:600}
  .acts{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);font-size:14px;font-weight:600;
    text-align:center;text-decoration:none;cursor:pointer;font-family:inherit}
  .btn:active{background:#2c3644}
  .btn.go{background:var(--amber);color:#1a1206;border-color:var(--amber)}
  .btn.done{background:var(--ta);color:#08210e;border-color:var(--ta)}
  .v-PILOT{border-left-color:var(--pilot)}
  .v-FLYINGJ{border-left-color:var(--flyingj)}
  .v-LOVES{border-left-color:var(--loves)}
  .v-TAPETRO{border-left-color:var(--ta)}
  .v-JBHUNT{border-left-color:var(--jbh)}
  .empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:14px}
  .note{font-size:12px;color:var(--dim);text-align:center;padding:8px 16px 0;line-height:1.35}

  #sheet{position:absolute;left:8px;right:8px;bottom:calc(8px + var(--sb));z-index:30;
    background:var(--panel);border:1px solid var(--line);border-left-width:5px;
    border-radius:14px;padding:12px 14px;box-shadow:0 -4px 24px rgba(0,0,0,.6)}
  #sheet .x{position:absolute;top:8px;right:10px;color:var(--dim);font-size:22px;
    line-height:1;padding:4px 8px;cursor:pointer}

  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--sb));
    background:var(--ta);color:#08210e;padding:11px 20px;border-radius:22px;font-weight:650;
    font-size:14px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .18s}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="titlebar"><h1>J.B. Hunt Fuel Stops</h1><span class="count" id="count"></span></div>
    <div class="row">
      <input type="search" id="q" placeholder="Search city, exit, address" autocomplete="off">
      <select id="state"><option value="">All states</option></select>
      <select id="vendor"><option value="">All brands</option></select>
    </div>
    <div class="tabs"><div class="tab on" id="tabMap">Map</div><div class="tab" id="tabList">List</div></div>
  </header>
  <main>
    <div id="map"><div id="tiles"></div><div id="pins"></div>
      <div id="attrib">© OpenStreetMap, © CARTO</div>
      <div class="mapbtns">
        <button class="mbtn" id="zin">+</button>
        <button class="mbtn" id="zout">−</button>
        <button class="mbtn" id="locate">◎</button>
      </div>
    </div>
    <div id="list" class="hidden"></div>
  </main>
</div>
<div id="toast">Address copied</div>

/* ================= map engine ================= */
const mapEl=document.getElementById('map'),tilesEl=document.getElementById('tiles'),pinsEl=document.getElementById('pins');
const TS=256, MINZ=3, MAXZ=17;
let view={lat:41.6,lng:-88.2,z:5};
let W=0,H=0;

function project(lat,lng,z){
  const world=TS*Math.pow(2,z);
  const x=(lng+180)/360*world;
  const s=Math.max(-0.9999,Math.min(0.9999,Math.sin(lat*Math.PI/180)));
  const y=(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*world;
  return {x,y};
}
function unproject(x,y,z){
  const world=TS*Math.pow(2,z);
  const lng=x/world*360-180;
  const n=Math.PI-2*Math.PI*y/world;
  const lat=180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
  return {lat,lng};
}
function measure(){ W=mapEl.clientWidth; H=mapEl.clientHeight; }

const TILE_SOURCES=[
  {u:(z,x,y)=>`https://basemaps.cartocdn.com/dark_all/${z}/${x}/${y}.png`,dark:true,a:'\u00a9 OpenStreetMap, \u00a9 CARTO'},
  {u:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`,dark:false,a:'\u00a9 OpenStreetMap contributors'}
];
let srcIdx=0,tileCache={},tileFail=0,tileOk=0,tileWarned=false;

function clearTiles(){ tilesEl.innerHTML=''; tileCache={}; }
function nextSource(){
  if(srcIdx<TILE_SOURCES.length-1){
    srcIdx++; tileFail=0; tileOk=0; clearTiles();
    tilesEl.classList.toggle('light',!TILE_SOURCES[srcIdx].dark);
    document.getElementById('attrib').textContent=TILE_SOURCES[srcIdx].a;
    draw();
  } else tileWarn();
}
function tileWarn(){
  if(tileWarned) return; tileWarned=true;
  banner("Map imagery is blocked here","Road imagery loads from the internet, and this window won't allow it. The pins, distances and List tab all still work. To get the road map, save this file and open it in Safari or Chrome.");
}
function drawTiles(){
  const iz=Math.max(MINZ,Math.min(MAXZ,Math.round(view.z)));
  const scale=Math.pow(2,view.z-iz);
  const c=project(view.lat,view.lng,iz);
  tilesEl.style.transform=`translate(${W/2-c.x*scale}px,${H/2-c.y*scale}px) scale(${scale})`;
  const n=Math.pow(2,iz);
  const x0=Math.floor((c.x-W/2/scale)/TS),x1=Math.floor((c.x+W/2/scale)/TS);
  const y0=Math.floor((c.y-H/2/scale)/TS),y1=Math.floor((c.y+H/2/scale)/TS);
  const keep={};
  for(let ty=y0;ty<=y1;ty++){
    if(ty<0||ty>=n) continue;
    for(let tx=x0;tx<=x1;tx++){
      const wx=((tx%n)+n)%n, key=iz+'/'+wx+'/'+ty+'/'+tx;
      keep[key]=1;
      if(!tileCache[key]){
        const img=document.createElement('img');
        img.style.left=(tx*TS)+'px'; img.style.top=(ty*TS)+'px';
        img.decoding='async'; img.referrerPolicy='no-referrer';
        img.onload=()=>{tileOk++;};
        img.onerror=()=>{ tileFail++; if(!tileOk&&tileFail>=4) nextSource(); };
        img.src=TILE_SOURCES[srcIdx].u(iz,wx,ty);
        tilesEl.appendChild(img); tileCache[key]=img;
      }
    }
  }
  for(const k in tileCache){
    if(keep[k]) tileCache[k].style.display='';
    else if(k.split('/')[0]!=String(iz)){ tileCache[k].remove(); delete tileCache[k]; }
    else tileCache[k].style.display='none';
  }
}

/* dismissable banner */
function banner(title,body){
  const old=document.getElementById('hint'); if(old) old.remove();
  const d=document.createElement('div'); d.id='hint';
  d.innerHTML=`<b>${title}</b><p>${body}</p><button class="btn" onclick="this.parentElement.remove()">Got it</button>`;
  mapEl.appendChild(d);
}

/* pins */
const pinEls=STOPS.map((s,i)=>{
  const el=document.createElement('div');
  el.className='pin'; el.style.background=COLORS[s.v]||'#999';
  el.addEventListener('click',ev=>{ ev.stopPropagation(); selectStop(i); });
  pinsEl.appendChild(el); return el;
});
let visibleIdx=new Set(STOPS.map((_,i)=>i));
let selected=null;

function drawPins(){
  const c=project(view.lat,view.lng,view.z);
  STOPS.forEach((s,i)=>{
    const el=pinEls[i];
    if(!visibleIdx.has(i)){ el.style.display='none'; return; }
    const p=project(s.lat,s.lng,view.z);
    const x=p.x-c.x+W/2, y=p.y-c.y+H/2;
    if(x<-30||y<-30||x>W+30||y>H+30){ el.style.display='none'; return; }
    el.style.display=''; el.style.left=x+'px'; el.style.top=y+'px';
    el.classList.toggle('sel',selected===i);
  });
  if(here){
    if(!meEl){ meEl=document.createElement('div'); meEl.className='me'; pinsEl.appendChild(meEl);
      meRing=document.createElement('div'); meRing.className='mering'; pinsEl.insertBefore(meRing,meEl); }
    const p=project(here.lat,here.lng,view.z);
    const x=p.x-c.x+W/2, y=p.y-c.y+H/2;
    meEl.style.left=x+'px'; meEl.style.top=y+'px';
    meEl.classList.toggle('manual',!!here.manual);
    meRing.style.display=here.manual?'none':'';
    const mPerPx=156543.03*Math.cos(here.lat*Math.PI/180)/Math.pow(2,view.z);
    const r=Math.max(10,Math.min(160,(here.acc||200)/mPerPx));
    meRing.style.width=(r*2)+'px'; meRing.style.height=(r*2)+'px';
    meRing.style.left=(x-r)+'px'; meRing.style.top=(y-r)+'px';
  }
}
let meEl=null,meRing=null;

let raf=null;
function draw(){ if(raf) return; raf=requestAnimationFrame(()=>{ raf=null; measure(); drawTiles(); drawPins(); }); }

function setView(lat,lng,z){
  view.lat=lat; view.lng=lng;
  if(z!=null) view.z=Math.max(MINZ,Math.min(MAXZ,z));
  view.lat=Math.max(-85,Math.min(85,view.lat));
  draw();
}
function panBy(dx,dy){
  const c=project(view.lat,view.lng,view.z);
  const ll=unproject(c.x-dx,c.y-dy,view.z);
  setView(ll.lat,ll.lng);
}
function zoomAround(newZ,sx,sy){
  newZ=Math.max(MINZ,Math.min(MAXZ,newZ));
  const c=project(view.lat,view.lng,view.z);
  const anchor=unproject(c.x+(sx-W/2),c.y+(sy-H/2),view.z);
  view.z=newZ;
  const a2=project(anchor.lat,anchor.lng,newZ);
  const ll=unproject(a2.x-(sx-W/2),a2.y-(sy-H/2),newZ);
  setView(ll.lat,ll.lng);
}
function fitBounds(pts,pad){
  if(!pts.length) return;
  let n=-90,s=90,e=-180,w=180;
  pts.forEach(p=>{n=Math.max(n,p.lat);s=Math.min(s,p.lat);e=Math.max(e,p.lng);w=Math.min(w,p.lng);});
  measure();
  if(pts.length===1){ setView(s,w,11); return; }
  let z=MAXZ;
  for(;z>MINZ;z--){
    const a=project(n,w,z), b=project(s,e,z);
    if((b.x-a.x)<W-2*pad && (b.y-a.y)<H-2*pad) break;
  }
  const cx=(project(n,w,z).x+project(s,e,z).x)/2, cy=(project(n,w,z).y+project(s,e,z).y)/2;
  const ll=unproject(cx,cy,z);
  setView(ll.lat,ll.lng,z);
}

/* gestures */
const ptrs=new Map();
let last=null, pinchStart=null, moved=0, tapTime=0;
mapEl.addEventListener('pointerdown',e=>{
  mapEl.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved=0;
  if(ptrs.size===1){ last={x:e.clientX,y:e.clientY}; mapEl.classList.add('drag'); }
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    pinchStart={d:Math.hypot(a.x-b.x,a.y-b.y),z:view.z};
  }
});
mapEl.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1&&last){
    const dx=e.clientX-last.x, dy=e.clientY-last.y;
    moved+=Math.abs(dx)+Math.abs(dy);
    last={x:e.clientX,y:e.clientY};
    panBy(dx,dy);
  } else if(ptrs.size===2&&pinchStart){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const r=mapEl.getBoundingClientRect();
    const mx=(a.x+b.x)/2-r.left, my=(a.y+b.y)/2-r.top;
    if(d>0) zoomAround(pinchStart.z+Math.log2(d/pinchStart.d),mx,my);
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinchStart=null;
  if(ptrs.size===0){
    mapEl.classList.remove('drag'); last=null;
    if(moved<8){
      const r=mapEl.getBoundingClientRect();
      if(pickMode){
        const c=project(view.lat,view.lng,view.z);
        const ll=unproject(c.x+(e.clientX-r.left-W/2),c.y+(e.clientY-r.top-H/2),view.z);
        pickMode=false; locateBtn.textContent='\u25ce'; mapEl.classList.remove('pick');
        setHere(ll.lat,ll.lng,0,true); toast("Spot set");
        return;
      }
      const now=Date.now();
      if(now-tapTime<300){
        zoomAround(view.z+1,e.clientX-r.left,e.clientY-r.top);
        tapTime=0;
      } else tapTime=now;
    }
  } else if(ptrs.size===1){ const p=[...ptrs.values()][0]; last={x:p.x,y:p.y}; }
}
mapEl.addEventListener('pointerup',endPtr);
mapEl.addEventListener('pointercancel',endPtr);
mapEl.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=mapEl.getBoundingClientRect();
  zoomAround(view.z-Math.sign(e.deltaY)*0.5,e.clientX-r.left,e.clientY-r.top);
},{passive:false});
document.getElementById('zin').onclick=()=>zoomAround(Math.round(view.z)+1,W/2,H/2);
document.getElementById('zout').onclick=()=>zoomAround(Math.round(view.z)-1,W/2,H/2);
window.addEventListener('resize',()=>{measure();draw();});

mapEl.addEventListener('click',e=>{ if(e.target===mapEl||e.target===pinsEl) closeSheet(); });
const mapsLink=s=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fullAddr(s))}`;
const fmtMi=d=> d<10 ? d.toFixed(1)+" mi" : Math.round(d)+" mi";

/* ================= copy ================= */
function copyAddr(i,btn){
  const text=fullAddr(STOPS[i]);
  const ok=()=>{ if(btn){const t=btn.textContent;btn.textContent="Copied";btn.classList.add("done");
    setTimeout(()=>{btn.textContent=t;btn.classList.remove("done")},1400);} toast("Address copied"); };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(ok).catch(()=>legacy(text,ok));
  } else legacy(text,ok);
}
function legacy(text,ok){
  const ta=document.createElement('textarea');
  ta.value=text; ta.contentEditable=true; ta.readOnly=false;
  ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(ta);
  const range=document.createRange(); range.selectNodeContents(ta);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  ta.setSelectionRange(0,999999);
  let done=false;
  try{ done=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(done) ok(); else prompt("Copy this address:",text);
}
let toastT;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1600);
}

/* ================= location ================= */
let here=null,watchId=null,pickMode=false;
const locateBtn=document.getElementById('locate');

function setHere(lat,lng,acc,manual){
  const first=!here;
  here={lat,lng,acc:acc||0,manual:!!manual};
  locateBtn.classList.add('on');
  if(first) setView(lat,lng,Math.max(view.z,manual?view.z:9));
  render();
}
function stopLocate(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  here=null; pickMode=false; locateBtn.classList.remove('on'); locateBtn.textContent='\u25ce';
  mapEl.classList.remove('pick'); render();
}
locateBtn.onclick=()=>{
  if(pickMode){ pickMode=false; locateBtn.textContent='\u25ce'; mapEl.classList.remove('pick'); return; }
  if(here||watchId!==null){ stopLocate(); return; }
  startLocate();
};
function startLocate(){
  if(!navigator.geolocation){ offerManual("This browser doesn't offer location at all."); return; }
  toast("Finding you\u2026");
  let answered=false;
  watchId=navigator.geolocation.watchPosition(pos=>{
    answered=true;
    setHere(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy,false);
  },err=>{
    if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    if(answered) return;
    offerManual(err.code===1
      ? "Location permission was refused for this page."
      : "The GPS didn't answer in time.");
  },{enableHighAccuracy:true,maximumAge:15000,timeout:15000});
}
function offerManual(reason){
  const why = window.isSecureContext
    ? reason
    : reason+" Phone browsers only hand out GPS to pages loaded over https, and this file is opened straight off your device.";
  banner("Can't read your GPS here", why+" You can set your spot by hand instead \u2014 distances and nearest-first sorting work exactly the same.<br><br>Tap <b>Set my spot</b>, then tap the map where you are.");
  const b=document.getElementById('hint');
  const btn=document.createElement('button');
  btn.className='btn go'; btn.textContent='Set my spot';
  btn.onclick=()=>{ b.remove(); enterPick(); };
  b.appendChild(btn);
}
function enterPick(){
  pickMode=true; locateBtn.textContent='\u2295'; mapEl.classList.add('pick');
  toast("Tap the map where you are");
}

function miles(a,b){
  const R=3958.8,rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad,dLng=(b.lng-a.lng)*rad;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

/* ================= filters, list ================= */
const q=document.getElementById('q'),stSel=document.getElementById('state'),vSel=document.getElementById('vendor');
[...new Set(STOPS.map(s=>s.st))].sort().forEach(v=>stSel.add(new Option(v,v)));
[...new Set(STOPS.map(s=>s.v))].sort().forEach(v=>vSel.add(new Option(v==="JBHUNT"?"J.B. Hunt":v,v)));

function matches(s){
  const t=q.value.trim().toLowerCase();
  if(stSel.value&&s.st!==stSel.value) return false;
  if(vSel.value&&s.v!==vSel.value) return false;
  if(!t) return true;
  return (s.s+" "+s.c+" "+s.st+" "+s.a+" "+s.h+" "+s.n+" "+s.v).toLowerCase().includes(t);
}
function render(){
  const rows=[];
  visibleIdx=new Set();
  STOPS.forEach((s,i)=>{ if(matches(s)){ visibleIdx.add(i); rows.push({s,i,d:here?miles(here,s):null}); } });
  rows.sort((a,b)=> here ? a.d-b.d
    : (a.s.st===b.s.st ? a.s.c.localeCompare(b.s.c) : a.s.st.localeCompare(b.s.st)));
  document.getElementById('count').textContent=
    rows.length+" of "+STOPS.length+" stops"+(here?" · nearest first":"");
  const list=document.getElementById('list');
  list.innerHTML = rows.length ? rows.map(({s,i,d})=>`
    <div class="stop ${vclass(s.v)}">
      ${d!==null?`<span class="dist">${fmtMi(d)}</span>`:""}
      <h2>${esc(s.s)}</h2>
      <div class="meta">${esc(s.c)}, ${s.st} · #${s.n}</div>
      <div class="addr">${esc(s.a)}</div>
      <div class="hwy">${esc(s.h)}</div>
      <div class="acts">
        <button class="btn" onclick="copyAddr(${i},this)">Copy address</button>
        <button class="btn" onclick="showOnMap(${i})">Map</button>
        <a class="btn go" target="_blank" rel="noopener" href="${mapsLink(s)}">Go</a>
      </div>
    </div>`).join("")+
    `<div class="note">Pins are placed from the street address and can sit a few hundred feet off. Copy and Go use the address text, so navigation is exact.</div>`
    : '<div class="empty">Nothing matches that. Try a city, an exit number, or clear the filters.</div>';
  if(selected!==null&&!visibleIdx.has(selected)) closeSheet();
  draw();
}
function showOnMap(i){ setTab('map'); setView(STOPS[i].lat,STOPS[i].lng,13); selectStop(i); }

/* ================= tabs ================= */
const tabMap=document.getElementById('tabMap'),tabList=document.getElementById('tabList');
function setTab(which){
  const isMap=which==='map';
  tabMap.classList.toggle('on',isMap); tabList.classList.toggle('on',!isMap);
  mapEl.classList.toggle('hidden',!isMap);
  document.getElementById('list').classList.toggle('hidden',isMap);
  const sh=document.getElementById('sheet'); if(sh) sh.classList.toggle('hidden',!isMap);
  if(isMap) setTimeout(()=>{measure();draw();},30);
}
tabMap.onclick=()=>setTab('map');
tabList.onclick=()=>setTab('list');
q.addEventListener('input',render);
stSel.addEventListener('change',render);
vSel.addEventListener('change',render);

measure();
fitBounds(STOPS,40);
render();

</script>
</body>
</html>
